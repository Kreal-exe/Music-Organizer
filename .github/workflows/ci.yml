name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The tag tests build real files and read them back with ffprobe; without
      # ffmpeg they would quietly skip themselves.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build the phone agent
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false \
            -ldflags="-s -w" -o internal/device/agent/mlm-agent-arm64 ./cmd/agent

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...

      # -short leaves out the tests that go to the lyrics services.
      - run: go test -short ./...
